# Draws the contribution graph as a snake, daily, into the output branch the README shows.
name: snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2e2160,#4b34a8,#6d4ae0,#a78bfa
            dist/snake-light.svg?color_snake=#6d4ae0&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#6d4ae0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
