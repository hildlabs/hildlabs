# Keeps the Daybreak download pill in the profile README current.
# Commits only when the shown number changes (in steps of 1k).
name: downloads
on:
  schedule:
    # Hourly, like the registry itself. GitHub may delay or skip single
    # scheduled runs, so a daily run alone can leave the pill a day or more behind.
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: downloads
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_downloads.py
      - name: Commit if changed
        run: |
          git diff --quiet assets/chips/daybreak-downloads.svg README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Daybreak download count" assets/chips/daybreak-downloads.svg README.md
          git push
