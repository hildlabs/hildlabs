<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="hildlabs logo">
  <title>hildlabs</title>
  <defs>
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="88">
      <stop offset="0" stop-color="#f4f5fa"/>
      <stop offset="1" stop-color="#8f94b3"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d4ae0"/>
    </linearGradient>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#ffffff"/>
      <g fill="#000000">
        <circle cx="28" cy="20" r="3"/><circle cx="28" cy="80" r="3"/><circle cx="52" cy="80" r="3"/>
        <circle cx="84" cy="80" r="3"/><circle cx="28" cy="47" r="2"/><circle cx="70" cy="20" r="3"/>
      </g>
    </mask>
    <filter id="padglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <g transform="translate(-6 0)">
    <circle cx="70" cy="20" r="10" fill="#8b5cf6" opacity="0.6" filter="url(#padglow)"/>
    <g mask="url(#holes)">
      <g fill="none" stroke="url(#copper)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 20 V 80"/>
        <path d="M 28 47 H 37 L 52 62 V 80"/>
        <path d="M 70 20 V 66 L 84 80"/>
      </g>
      <g fill="url(#copper)">
        <circle cx="28" cy="20" r="7.5"/>
        <circle cx="28" cy="80" r="7.5"/>
        <circle cx="52" cy="80" r="7.5"/>
        <circle cx="84" cy="80" r="7.5"/>
        <circle cx="28" cy="47" r="5.5"/>
      </g>
      <circle cx="70" cy="20" r="7.5" fill="url(#violet)"/>
    </g>
  </g>
</svg>
