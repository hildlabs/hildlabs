<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">hildlabs</title>
  <desc id="d">The hildlabs logo, an hl drawn as circuit traces, wired into softly glowing traces, with the words: hildlabs. Hardware, homelab and tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f1c"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.16" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#7c5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#4f8bff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2f8"/>
      <stop offset="1" stop-color="#6a6f8c"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d4ae0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5fb"/>
      <stop offset="1" stop-color="#b9b3f5"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="card"><rect x="2" y="2" width="1196" height="336" rx="22"/></clipPath>
    <!-- the logo's copper and its drill holes, in the logo's own 100 x 100 space -->
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="88">
      <stop offset="0" stop-color="#f4f5fa"/>
      <stop offset="1" stop-color="#8f94b3"/>
    </linearGradient>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#ffffff"/>
      <g fill="#000000">
        <circle cx="28" cy="20" r="3"/><circle cx="28" cy="80" r="3"/><circle cx="52" cy="80" r="3"/>
        <circle cx="84" cy="80" r="3"/><circle cx="28" cy="47" r="2"/><circle cx="70" cy="20" r="3"/>
      </g>
    </mask>
    <filter id="padglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- circuit traces: around the logo, along the edges, and on the right -->
    <path id="c1"  d="M 0 112 H 40 L 70 82 H 92"/>
    <path id="c2"  d="M 0 272 H 98 L 125 245 H 150"/>
    <path id="c3"  d="M 0 318 H 150 L 172 296 H 186 L 210 272 V 245"/>
    <path id="c13" d="M 255 95 V 66 L 282 39 H 336 L 356 19 V 0"/>
    <path id="c14" d="M 290 245 L 318 273 H 352 L 380 301 V 340"/>
    <path id="c4"  d="M 40 0 V 24 L 64 48 H 110"/>
    <path id="c5"  d="M 328 140 H 352 L 372 120"/>
    <path id="c6"  d="M 380 0 V 20 L 410 50 H 520"/>
    <path id="c7"  d="M 700 0 V 34 L 730 64 H 860"/>
    <path id="c8"  d="M 1200 58 H 1100 L 1060 98 H 960"/>
    <path id="c9"  d="M 1200 164 H 1130 L 1090 204 H 1010 L 990 224"/>
    <path id="c10" d="M 1200 282 H 1150 L 1118 250 H 1062"/>
    <path id="c11" d="M 1000 340 V 318 L 1030 288 H 1080"/>
    <path id="c12" d="M 560 340 V 318 L 584 298 H 690"/>
  </defs>
  <style>
    .trace { fill: none; stroke: #262c48; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .glow  { opacity: 0; animation: breathe 8s ease-in-out infinite; }
    .glow use { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .halo  { stroke-width: 7; stroke-opacity: 0.55; filter: url(#soft); }
    .core  { stroke-width: 2; }
    .v use { stroke: #9b7cfa; }
    .b use { stroke: #6f9bff; }
    .node  { fill: #333a5a; }
    .ring  { fill: #0f1220; stroke-width: 2.5; animation: beat 8s ease-in-out infinite; }
    .rv    { stroke: #a78bfa; }
    .rc    { stroke: #7dd3fc; }
    .word  { font: 700 86px "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; letter-spacing: -1px; }
    .tag   { font: 500 27px "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #aab2cf; }
    .mono  { font: 500 18px "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #7c86a8; letter-spacing: 1px; }
    .prompt { fill: #a78bfa; }
    .caret { fill: #a78bfa; animation: blink 1.1s steps(1) infinite; }
    .power { opacity: 0.6; animation: power 4s ease-in-out infinite; }
    @keyframes power   { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    @keyframes breathe { 0%, 100% { opacity: 0; } 50% { opacity: 0.7; } }
    @keyframes beat    { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @keyframes blink   { 50% { fill: transparent; } }
    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; opacity: 0.25; }
      .ring, .caret, .power { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowL)"/>
    <rect width="1200" height="340" fill="url(#glowR)"/>

    <g class="trace">
      <use href="#c1"/><use href="#c2"/><use href="#c3"/><use href="#c4"/>
      <use href="#c5"/><use href="#c6"/><use href="#c7"/><use href="#c8"/>
      <use href="#c9"/><use href="#c10"/><use href="#c11"/><use href="#c12"/>
      <use href="#c13"/><use href="#c14"/>
    </g>
    <!-- the powered pad's own trace stays faintly lit -->
    <use href="#c13" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/>

    <!-- each trace lights up in turn, slowly -->
    <g class="glow v" style="animation-delay: 0s"><use href="#c1" class="halo"/><use href="#c1" class="core"/></g>
    <g class="glow b" style="animation-delay: -5.3s"><use href="#c8" class="halo"/><use href="#c8" class="core"/></g>
    <g class="glow v" style="animation-delay: -2.7s"><use href="#c9" class="halo"/><use href="#c9" class="core"/></g>
    <g class="glow b" style="animation-delay: -6.6s"><use href="#c2" class="halo"/><use href="#c2" class="core"/></g>
    <g class="glow v" style="animation-delay: -4s"><use href="#c7" class="halo"/><use href="#c7" class="core"/></g>
    <g class="glow b" style="animation-delay: -1.3s"><use href="#c10" class="halo"/><use href="#c10" class="core"/></g>
    <g class="glow v" style="animation-delay: -7.3s"><use href="#c3" class="halo"/><use href="#c3" class="core"/></g>
    <g class="glow b" style="animation-delay: -3.3s"><use href="#c6" class="halo"/><use href="#c6" class="core"/></g>
    <g class="glow v" style="animation-delay: -6s"><use href="#c11" class="halo"/><use href="#c11" class="core"/></g>
    <g class="glow b" style="animation-delay: -2s"><use href="#c4" class="halo"/><use href="#c4" class="core"/></g>
    <g class="glow v" style="animation-delay: -4.7s"><use href="#c12" class="halo"/><use href="#c12" class="core"/></g>
    <g class="glow b" style="animation-delay: -0.7s"><use href="#c5" class="halo"/><use href="#c5" class="core"/></g>
    <g class="glow v" style="animation-delay: -3.7s"><use href="#c13" class="halo"/><use href="#c13" class="core"/></g>
    <g class="glow b" style="animation-delay: -5.8s"><use href="#c14" class="halo"/><use href="#c14" class="core"/></g>

    <circle class="node" cx="94" cy="210" r="5"/>
    <circle class="node" cx="372" cy="120" r="5"/>
    <circle class="node" cx="520" cy="50" r="5"/>
    <circle class="node" cx="990" cy="224" r="5"/>
    <circle class="node" cx="1062" cy="250" r="5"/>
    <circle class="node" cx="690" cy="298" r="5"/>
    <circle class="ring rv" cx="92" cy="82" r="7"/>
    <circle class="ring rc" cx="110" cy="48" r="6" style="animation-delay: -2s"/>
    <circle class="ring rc" cx="960" cy="98" r="8" style="animation-delay: -5.3s"/>
    <circle class="ring rv" cx="860" cy="64" r="6" style="animation-delay: -4s"/>
    <circle class="ring rv" cx="1080" cy="288" r="7" style="animation-delay: -6s"/>

    <!-- the hildlabs logo: hl drawn as traces between copper pads, the l's top pad powered -->
    <g id="logo" transform="translate(95 45) scale(2.5)">
      <g transform="translate(-6 0)">
        <circle cx="70" cy="20" r="10" fill="#8b5cf6" filter="url(#padglow)" class="power"/>
        <g mask="url(#holes)">
          <g fill="none" stroke="url(#copper)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 28 20 V 80"/>
            <path d="M 28 47 H 37 L 52 62 V 80"/>
            <path d="M 70 20 V 66 L 84 80"/>
          </g>
          <g fill="url(#copper)">
            <circle cx="28" cy="20" r="7.5"/>
            <circle cx="28" cy="80" r="7.5"/>
            <circle cx="52" cy="80" r="7.5"/>
            <circle cx="84" cy="80" r="7.5"/>
            <circle cx="28" cy="47" r="5.5"/>
          </g>
          <circle cx="70" cy="20" r="7.5" fill="url(#violet)"/>
        </g>
      </g>
    </g>

    <text x="420" y="168" class="word" fill="url(#word)">hildlabs</text>
    <text x="424" y="220" class="tag">Hardware, homelab and tools.</text>
    <text x="424" y="270" class="mono"><tspan class="prompt">&gt;</tspan> built with Claude Code &amp; ChatGPT Codex<tspan class="caret">▌</tspan></text>
  </g>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.85"/>
</svg>
